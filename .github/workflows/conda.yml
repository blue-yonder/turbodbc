name: Build and test with conda

on:
  push:
  pull_request:
  schedule:
    - cron: '47 6 * * *'


# Automatically stop old builds on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -ex {0}

env:
  TEST_DB_PASSWORD: ${{ format('Turbodbc-CI-{0}-{1}!', github.run_id, github.run_attempt) }}

jobs:
  linux-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          environments: default
      - name: Build the sdist
        run: pixi run python -m build --sdist --no-isolation
      - name: Publish package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags') && github.repository == 'blue-yonder/turbodbc'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_UPLOAD }}
          packages_dir: dist
  linux-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "py311-pa18"
          - "py312-pa20"
          - "py313-pa21"
          - "py314-pa23"
          - "py314-pa24"
          - "py315-pa26"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          environments: ${{ matrix.environment }}
      - name: Build the wheel
        run: pixi run -e ${{ matrix.environment }} meson setup -Dbuild_testing=true builddir .
      - name: Build the wheel
        run: pixi run -e ${{ matrix.environment }} ninja -C builddir
      - name: Build the wheel
        run: pixi run -e ${{ matrix.environment }} ninja -C builddir test
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "py311-pa18"
          - "py311-pa20"
          - "py312-pa20"
          - "py313-pa21"
          - "py313-pa23"
          - "py314-pa23"
          - "py314-pa24"
          - "py315-pa26"
    services:
      postgres:
        image: postgres:11
        options: "--hostname postgres"
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
      mysql:
        # test do not run with a newer mysql at the moment
        image: mysql:8.3
        # command: --default-authentication-plugin=mysql_native_password
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          MYSQL_USER: mysqluser
          MYSQL_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -U sa -P \"${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Fetch full git history
        run: git fetch --prune --unshallow
      - name: Install MS SQL Drivers
        run: |
          source /etc/os-release
          curl -fsSL "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" \
            -o "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 mssql-tools18
          SQLCMDPASSWORD="$TEST_DB_PASSWORD" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U SA -C -b -Q 'CREATE DATABASE test_db' -l 60
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          environments: ${{ matrix.environment }}
      - name: pip list
        run: pixi run -e ${{ matrix.environment }} python -m pip list
      - name: pip list
        run: pixi run -e ${{ matrix.environment }} python -m pip check
      - name: Build the wheel
        run: pixi run -e ${{ matrix.environment }} python -m build --no-isolation --wheel --verbose
      - name: Install the built wheel
        run: pixi run -e ${{ matrix.environment }} python -m pip install dist/*.whl
      - name: Import test
        run: pixi run -e ${{ matrix.environment }} python -c 'import turbodbc'
      - name: Prepare ODBC
        run: |
          mkdir -p "$RUNNER_TEMP/turbodbc-odbc"
          sed -e "s/^\([[:space:]]*password[[:space:]]*=\).*/\1 $TEST_DB_PASSWORD/I" \
            -e 's/^Driver = ODBC Driver 17 for SQL Server$/Driver = ODBC Driver 18 for SQL Server/' \
            -e '/^\[MSSQL\]/a TrustServerCertificate = Yes' \
            odbc_test_linux/odbc.ini > "$RUNNER_TEMP/turbodbc-odbc/odbc.ini"
          pixi run -e ${{ matrix.environment }} bash -c 'sed "s;CONDA_PREFIX;${CONDA_PREFIX};g" odbc_test_linux/odbcinst.ini' \
            > "$RUNNER_TEMP/turbodbc-odbc/odbcinst.ini"
          /usr/bin/odbcinst -q -d -n 'ODBC Driver 18 for SQL Server' >> "$RUNNER_TEMP/turbodbc-odbc/odbcinst.ini"
          jq --arg password "$TEST_DB_PASSWORD" '.password = $password' tests/query_fixtures_mssql.json \
            > "$RUNNER_TEMP/turbodbc-odbc/query_fixtures_mssql.json"
      - name: Build and test
        run: ODBCSYSINI="$RUNNER_TEMP/turbodbc-odbc" pixi run -e ${{ matrix.environment }} pytest
        env:
          # TURBODBC_TEST_CONFIGURATION_FILES: "tests/query_fixtures_postgresql.json,tests/query_fixtures_mysql.json,tests/query_fixtures_mssql.json"
          TURBODBC_TEST_CONFIGURATION_FILES: "tests/query_fixtures_postgresql.json,${{ runner.temp }}/turbodbc-odbc/query_fixtures_mssql.json"
  macos-tests:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "py311-pa18"
          - "py311-pa20"
          - "py312-pa20"
          - "py313-pa21"
          - "py313-pa23"
          - "py314-pa23"
          - "py314-pa24"
          - "py315-pa26"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Fetch full git history
        run: git fetch --prune --unshallow
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          environments: ${{ matrix.environment }}
      - name: Create postgres test_db
        run: pixi run -e ${{ matrix.environment }} bash -c 'initdb -D test_db --username="runner" --pwfile=<(printf "%s\n" "$TEST_DB_PASSWORD")'
      - name: Start postgres
        run: pixi run -e ${{ matrix.environment }} pg_ctl -D test_db -l logfile start
      - name: Create inner database
        run: pixi run -e ${{ matrix.environment }} createdb --owner=runner test_db
      - name: Build the wheel
        run: pixi run -e ${{ matrix.environment }} bash -c 'CXXFLAGS="$CXXFLAGS -ggdb -fno-omit-frame-pointer" python -m build --no-isolation'
      - name: Install the built wheel
        run: pixi run -e ${{ matrix.environment }} python -m pip install dist/*.whl
      - name: Import test
        run: pixi run -e ${{ matrix.environment }} python -c 'import turbodbc'
      - name: Prepare ODBC
        run: |
          mkdir -p "$RUNNER_TEMP/turbodbc-odbc"
          sed "s/^Password[[:space:]]*=.*/Password = $TEST_DB_PASSWORD/" odbc_test_osx/odbc.ini \
            > "$RUNNER_TEMP/turbodbc-odbc/odbc.ini"
          pixi run -e ${{ matrix.environment }} bash -c 'sed "s;CONDA_PREFIX;${CONDA_PREFIX};g" odbc_test_osx/odbcinst.ini' \
            > "$RUNNER_TEMP/turbodbc-odbc/odbcinst.ini"
      - name: Build and test
        env:
          TURBODBC_TEST_CONFIGURATION_FILES: "tests/query_fixtures_postgresql.json"
        run: pixi run -e ${{ matrix.environment }} bash -c 'ulimit -c unlimited && ODBCSYSINI="$RUNNER_TEMP/turbodbc-odbc" pytest -sv || (lldb -o "target create python --core $(ls /cores/core*)" -o "bt all" -o "quit"; exit 1)'
  windows-pixi-tests:
    defaults:
      run:
        shell: cmd /C call {0}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - "py311-pa18"
          - "py311-pa20"
          - "py312-pa20"
          - "py313-pa21"
          - "py313-pa23"
          - "py314-pa23"
          - "py314-pa24"
          - "py315-pa26"
    steps:
      - name: Create SQL Server
        shell: pwsh
        run: |
          Write-Host "Downloading"
          Import-Module BitsTransfer
          Start-BitsTransfer -Source "https://download.microsoft.com/download/3/8/d/38de7036-2433-4207-8eae-06e247e17b25/SqlLocalDB.msi" -Destination SqlLocalDB.msi
          Write-Host "Installing"
          Start-Process -FilePath "SqlLocalDB.msi" -Wait -ArgumentList "/qn", "/norestart", "/l*v SqlLocalDBInstall.log", "IACCEPTSQLLOCALDBLICENSETERMS=YES"
          sqlcmd -S '(localdb)\MSSQLLocalDB' -Q 'CREATE DATABASE test_db' -l 60
      - name: Configure ODBC Data Source
        run: |
          odbcconf /a {CONFIGDSN "ODBC Driver 17 for SQL Server" "DSN=MSSQL|Server=(localdb)\MSSQLLocalDB|Database=test_db|Trusted_Connection=Yes"}
          if %errorlevel% neq 0 exit /b %errorlevel%
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Fetch full git history
        run: git fetch --prune --unshallow
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94
        with:
          environments: ${{ matrix.environment }}
      - name: Build wheel
        run: pixi run -e ${{ matrix.environment }} python -m build --no-isolation
      - name: Install wheel
        run: pixi run -e ${{ matrix.environment }} python -m pip install dist/*.whl
        shell: bash
      - name: Test
        run: pixi run -e ${{ matrix.environment }} pytest -sv
        env:
          TURBODBC_TEST_CONFIGURATION_FILES: "tests/query_fixtures_mssql.json"
